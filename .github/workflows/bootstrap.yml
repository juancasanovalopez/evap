name: Bootstrap (first-time infra apply)

# Run ONCE manually to create the OIDC provider + deploy role so that the
# normal deploy.yml workflow can take over afterwards.
# After a successful run: delete BOOTSTRAP_AWS_* secrets from GitHub.
on:
  workflow_dispatch:
    inputs:
      github_repository:
        description: "GitHub repository (org/repo)"
        required: true
        default: "juancasanovalopez/evap"
      oauth_redirect_base_url:
        description: "Base URL for OAuth redirects (can be 'https://TEMP' — update after apply)"
        required: true
        default: "https://TEMP"
      allowed_cors_origins:
        description: "Comma-separated CORS origins (leave empty if unknown yet)"
        required: false
        default: ""

env:
  GO_VERSION_FILE: backend/go.mod
  TF_DIR: infra
  AWS_REGION: us-east-1

jobs:
  bootstrap:
    name: Bootstrap infra (admin credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Build & package Lambda binary
        working-directory: backend
        run: make package

      - uses: hashicorp/setup-terraform@v3

      # Uses long-lived admin IAM access keys stored as GitHub secrets.
      # These secrets are ONLY needed for this bootstrap run.
      - name: Configure AWS credentials (admin keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Import existing resources (idempotent re-run)
        working-directory: ${{ env.TF_DIR }}
        env:
          TF_VAR_github_repository: ${{ github.event.inputs.github_repository }}
          TF_VAR_oauth_redirect_base_url: ${{ github.event.inputs.oauth_redirect_base_url }}
        run: |
          # Create log group without tags to avoid logs:TagResource permission requirement.
          aws logs create-log-group --log-group-name "/aws/lambda/evap-api" 2>/dev/null || true

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          terraform import aws_cloudwatch_log_group.lambda /aws/lambda/evap-api || true
          terraform import aws_dynamodb_table.users evap_users || true
          terraform import aws_iam_role.lambda_exec evap-lambda-exec || true
          terraform import aws_iam_role_policy.lambda_permissions evap-lambda-exec:evap-lambda-permissions || true
          terraform import aws_iam_role.github_actions_deploy evap-github-actions-deploy || true
          terraform import aws_iam_role_policy.github_actions_permissions evap-github-actions-deploy:evap-github-actions-permissions || true
          terraform import aws_iam_openid_connect_provider.github \
            "arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com" || true
          terraform import 'aws_ssm_parameter.oauth_secrets["jwt_signing_key"]'      /evap/prod/jwt_signing_key || true
          terraform import 'aws_ssm_parameter.oauth_secrets["google_client_id"]'     /evap/prod/google_client_id || true
          terraform import 'aws_ssm_parameter.oauth_secrets["google_client_secret"]' /evap/prod/google_client_secret || true
          terraform import 'aws_ssm_parameter.oauth_secrets["github_client_id"]'     /evap/prod/github_client_id || true
          terraform import 'aws_ssm_parameter.oauth_secrets["github_client_secret"]' /evap/prod/github_client_secret || true
          terraform import aws_lambda_function.api evap-api || true
          terraform import aws_lambda_permission.apigw_invoke evap-api/AllowAPIGatewayInvoke || true

          # API Gateway resources use random IDs — look them up dynamically.
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='evap-api'].ApiId" --output text 2>/dev/null || true)
          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            terraform import aws_apigatewayv2_api.http_api "$API_ID" || true

            INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" \
              --query "Items[0].IntegrationId" --output text 2>/dev/null || true)
            if [ -n "$INTEGRATION_ID" ] && [ "$INTEGRATION_ID" != "None" ]; then
              terraform import aws_apigatewayv2_integration.lambda "${API_ID}/${INTEGRATION_ID}" || true
            fi

            ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" \
              --query "Items[0].RouteId" --output text 2>/dev/null || true)
            if [ -n "$ROUTE_ID" ] && [ "$ROUTE_ID" != "None" ]; then
              terraform import aws_apigatewayv2_route.default "${API_ID}/${ROUTE_ID}" || true
            fi

            terraform import aws_apigatewayv2_stage.default "${API_ID}/\$default" || true
          fi

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          CORS_VAR=""
          if [ -n "${{ github.event.inputs.allowed_cors_origins }}" ]; then
            # Convert comma-separated string to HCL list
            CORS_LIST=$(echo '${{ github.event.inputs.allowed_cors_origins }}' \
              | tr ',' '\n' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' \
              | awk '{printf "\"%s\",",$0}' | sed 's/,$//')
            CORS_VAR="-var=allowed_cors_origins=[${CORS_LIST}]"
          fi
          terraform apply -input=false -auto-approve \
            -var="github_repository=${{ github.event.inputs.github_repository }}" \
            -var="oauth_redirect_base_url=${{ github.event.inputs.oauth_redirect_base_url }}" \
            $CORS_VAR

      - name: Print outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "============================================"
          echo "IMPORTANT: copy these values before closing"
          echo "============================================"
          terraform output
          echo ""
          echo "Next steps:"
          echo "  1. Set GitHub secret  AWS_DEPLOY_ROLE_ARN = $(terraform output -raw github_actions_role_arn)"
          echo "  2. Set GitHub variable OAUTH_REDIRECT_BASE_URL = $(terraform output -raw api_endpoint)"
          echo "  3. Re-run terraform apply (or push a commit) with the real oauth_redirect_base_url"
          echo "  4. Delete secrets BOOTSTRAP_AWS_ACCESS_KEY_ID and BOOTSTRAP_AWS_SECRET_ACCESS_KEY"
