name: Deploy backend

on:
  push:
    branches: [master]
    paths: ["backend/**", "infra/**", ".github/workflows/deploy.yml"]
  pull_request:
    paths: ["backend/**", "infra/**", ".github/workflows/deploy.yml"]

permissions:
  contents: read
  id-token: write # required for AWS OIDC

env:
  GO_VERSION_FILE: backend/go.mod
  TF_DIR: infra
  AWS_REGION: eu-south-2

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports: ["8000:8000"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Unit tests
        run: go test ./...

      - name: Integration tests (DynamoDB Local)
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
        run: go test -tags=integration ./test/integration/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: backend

  terraform-plan:
    name: Terraform plan (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, lint]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -var="aws_region=${{ env.AWS_REGION }}" -var="github_repository=${{ github.repository }}" -var="oauth_redirect_base_url=${{ vars.OAUTH_REDIRECT_BASE_URL }}"

  deploy:
    name: Build, package & deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: backend/go.sum

      - name: Build & package Lambda binary
        working-directory: backend
        run: make package

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init & import existing resources (idempotent)
        working-directory: infra
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_oauth_redirect_base_url: ${{ vars.OAUTH_REDIRECT_BASE_URL }}
        run: |
          terraform init -input=false

          # State is local/ephemeral in CI, so every run starts empty. Adopt any
          # resources a previous run already created in AWS to avoid "already
          # exists" errors on apply. All imports are best-effort (|| true): if a
          # resource does not exist yet, apply will create it normally.

          # Pre-create the log group without tags so apply never needs
          # logs:TagResource at creation time (default_tags would require it).
          aws logs create-log-group --log-group-name "/aws/lambda/evap-api" 2>/dev/null || true

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          terraform import aws_cloudwatch_log_group.lambda /aws/lambda/evap-api || true
          terraform import aws_dynamodb_table.users evap_users || true
          terraform import aws_iam_role.lambda_exec evap-lambda-exec || true
          terraform import aws_iam_role_policy.lambda_permissions evap-lambda-exec:evap-lambda-permissions || true
          terraform import aws_iam_role.github_actions_deploy evap-github-actions-deploy || true
          terraform import aws_iam_role_policy.github_actions_permissions evap-github-actions-deploy:evap-github-actions-permissions || true
          terraform import aws_iam_openid_connect_provider.github \
            "arn:aws:iam::${ACCOUNT_ID}:oidc-provider/token.actions.githubusercontent.com" || true
          terraform import 'aws_ssm_parameter.oauth_secrets["jwt_signing_key"]'      /evap/prod/jwt_signing_key || true
          terraform import 'aws_ssm_parameter.oauth_secrets["google_client_id"]'     /evap/prod/google_client_id || true
          terraform import 'aws_ssm_parameter.oauth_secrets["google_client_secret"]' /evap/prod/google_client_secret || true
          terraform import 'aws_ssm_parameter.oauth_secrets["github_client_id"]'     /evap/prod/github_client_id || true
          terraform import 'aws_ssm_parameter.oauth_secrets["github_client_secret"]' /evap/prod/github_client_secret || true
          terraform import aws_lambda_function.api evap-api || true
          terraform import aws_lambda_permission.apigw_invoke evap-api/AllowAPIGatewayInvoke || true

          # API Gateway resources use random IDs — look them up dynamically.
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='evap-api'].ApiId" --output text 2>/dev/null || true)
          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            terraform import aws_apigatewayv2_api.http_api "$API_ID" || true

            INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" \
              --query "Items[0].IntegrationId" --output text 2>/dev/null || true)
            if [ -n "$INTEGRATION_ID" ] && [ "$INTEGRATION_ID" != "None" ]; then
              terraform import aws_apigatewayv2_integration.lambda "${API_ID}/${INTEGRATION_ID}" || true
            fi

            ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" \
              --query "Items[0].RouteId" --output text 2>/dev/null || true)
            if [ -n "$ROUTE_ID" ] && [ "$ROUTE_ID" != "None" ]; then
              terraform import aws_apigatewayv2_route.default "${API_ID}/${ROUTE_ID}" || true
            fi

            terraform import aws_apigatewayv2_stage.default "${API_ID}/\$default" || true
          fi

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform apply -input=false -auto-approve \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="github_repository=${{ github.repository }}" \
            -var="oauth_redirect_base_url=${{ vars.OAUTH_REDIRECT_BASE_URL }}"

      - name: Smoke test
        working-directory: infra
        run: |
          endpoint=$(terraform output -raw api_endpoint)
          curl --fail --silent --show-error "$endpoint/health"
