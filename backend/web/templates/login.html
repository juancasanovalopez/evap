<!DOCTYPE html>
<html lang="{{.Language}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{msg "login.title"}}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-shell">
    <section class="panel auth-panel">
      <p class="eyebrow">login</p>
      <h1>EVAP</h1>
      <p class="auth-copy">{{msg "login.description"}}</p>

      <div class="auth-actions">
        <a class="button primary large" href="/auth/google/login">{{msg "login.with_google"}}</a>
        <a class="button ghost large" href="/auth/github/login">{{msg "login.with_github"}}</a>
      </div>
    </section>
  </div>
</body>
</html>
